<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Empenhos - GACP</title>
  <link rel="stylesheet" href="../css/ver-empenhos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <section class="profile-section">
      <div class="profile-photo-container">
        <img id="profilePhoto" class="profile-photo" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjRkZGRkZGIi8+CjxjaXJjbGUgY3g9IjUwIiBjeT0iMzUiIHI9IjE1IiBmaWxsPSIjQ0NDQ0NDIi8+CjxyZWN0IHg9IjMwIiB5PSI2MCIgd2lkdGg9IjQwIiBoZWlnaHQ9IjMwIiBmaWxsPSIjQ0NDQ0NDIi8+Cjwvc3ZnPgo=" alt="Foto do usuário">
        <div class="photo-edit-overlay">
          <label for="photoInput" class="photo-edit-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </label>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>
      </div>
      <h3 id="userName" class="user-name">Carregando...</h3>
      <button class="logout-btn" onclick="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </section>

    <nav class="navigation-section">
      <h4 class="nav-title">Navegação</h4>
      <a class="nav-link" href="/home">Home</a>
      <a class="nav-link active" href="/ver-empenhos">Ver Empenhos</a>
      <a class="nav-link" href="/ver-pagamentos">Ver Pagamentos</a>
      <a class="nav-link" href="/anotacoes">Anotações</a>
      <a class="nav-link" href="/adicionar-empenho">Adicionar Empenho</a>
    </nav>
  </aside>

  <main class="content">
    <header class="page-header">
      <h1>Empenhos</h1>
    </header>

    <section id="listaEmpenhos" class="empenho-list"></section>
  </main>

  <script src="../js/ver-empenhos.js"></script>
</body>
</html>
