<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Anotações - GACP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🧪 Teste de Anotações GACP</h1>
    
    <div class="test-section">
        <h3>🔐 Status de Login</h3>
        <p><strong>Token:</strong> <span id="tokenStatus">Verificando...</span></p>
        <p><strong>Usuário:</strong> <span id="userStatus">Verificando...</span></p>
    </div>

    <div class="test-section">
        <h3>📝 Teste de API de Anotações</h3>
        <button onclick="testAnotacoesAPI()">Testar API de Anotações</button>
        <div id="apiResult" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h3>🔍 Teste de JavaScript</h3>
        <button onclick="testJavaScript()">Testar JavaScript</button>
        <div id="jsResult" class="result" style="display: none;"></div>
    </div>

    <script>
        // Verificar status de login
        function checkLoginStatus() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            document.getElementById('tokenStatus').textContent = token ? '✅ Definido' : '❌ Não definido';
            document.getElementById('userStatus').textContent = user ? '✅ ' + JSON.parse(user).nome : '❌ Não definido';
        }

        // Testar API de anotações
        async function testAnotacoesAPI() {
            const resultDiv = document.getElementById('apiResult');
            const token = localStorage.getItem('token');
            
            if (!token) {
                resultDiv.innerHTML = '<strong>❌ Erro:</strong> Nenhum token encontrado. Faça login primeiro.';
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                return;
            }

            try {
                const response = await fetch('/api/anotacoes', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                resultDiv.innerHTML = `<strong>Status:</strong> ${response.status}<br>`;
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML += `<strong>✅ Sucesso:</strong> ${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result success';
                } else {
                    const errorData = await response.json();
                    resultDiv.innerHTML += `<strong>❌ Erro:</strong> ${JSON.stringify(errorData, null, 2)}`;
                    resultDiv.className = 'result error';
                }
                
                resultDiv.style.display = 'block';
            } catch (error) {
                resultDiv.innerHTML = `<strong>❌ Erro de conexão:</strong> ${error.message}`;
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
            }
        }

        // Testar JavaScript
        function testJavaScript() {
            const resultDiv = document.getElementById('jsResult');
            
            try {
                // Simular o que o JavaScript de anotações faz
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const token = localStorage.getItem('token');
                
                let result = '<strong>✅ JavaScript funcionando!</strong><br>';
                result += `Token: ${token ? '✅' : '❌'}<br>`;
                result += `Usuário: ${user.id ? '✅ ID: ' + user.id : '❌'}<br>`;
                result += `Nome: ${user.nome || '❌'}<br>`;
                
                if (!user.id) {
                    result += '<br><strong>⚠️ Problema:</strong> Usuário não está logado corretamente.';
                }
                
                resultDiv.innerHTML = result;
                resultDiv.style.display = 'block';
                resultDiv.className = user.id ? 'result success' : 'result error';
                
            } catch (error) {
                resultDiv.innerHTML = `<strong>❌ Erro no JavaScript:</strong> ${error.message}`;
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
            }
        }

        // Verificar status ao carregar
        window.addEventListener('load', checkLoginStatus);
    </script>
</body>
</html>
